<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sovereign - Territorial Map</title>
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F4F4F4;
      --card: #FFFFFF;
      --line: #DCDCDC;
      --ink: #111111;
      --muted: #666666;
      --danger: #CC0000;
      --serif: "Newsreader", Georgia, serif;
      --sans: "DM Sans", system-ui, sans-serif;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root.auto-theme, :root.dark-theme {
        --bg: #111111;
        --surface: #1A1A1A;
        --card: #161616;
        --line: #2C2C2C;
        --ink: #F0F0F0;
        --muted: #999999;
        --danger: #FF5555;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      margin: 0; padding: 0; height: 100dvh; width: 100vw;
      background: var(--bg); color: var(--ink); font-family: var(--sans);
      overflow: hidden; overscroll-behavior: none;
    }

    button { font-family: inherit; }

    .app {
      position: relative; height: 100dvh; width: 100vw;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* Header */
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      background: var(--bg); z-index: 10;
    }
    .brand { font-family: var(--serif); font-size: 20px; font-weight: 600; }
    .back-btn {
      padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--surface); color: var(--ink); cursor: pointer;
      font-size: 13px; font-weight: 600; text-decoration: none;
    }

    /* Main Container */
    .content-container {
      flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 16px; gap: 16px;
    }

    /* Map Stage (4 Regions) */
    .map-container {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 16px; min-height: 280px;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px;
      box-shadow: var(--shadow); position: relative;
    }

    .map-region-box {
      background: var(--card); border: 1px solid var(--line); border-radius: 8px;
      padding: 14px; display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer; transition: transform 0.1s, border-color 0.1s; position: relative;
    }
    .map-region-box:hover { border-color: var(--ink); transform: scale(0.99); }
    .map-region-box.selected { border: 2px solid var(--ink); }

    .map-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }
    .map-region-title { font-family: var(--serif); font-weight: 600; font-size: 15px; margin-top: 6px; }

    /* Collapsible List */
    .list-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
    .list-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .list-title { font-family: var(--serif); font-size: 18px; margin: 0; }
    .toggle-list-btn { background: none; border: 0; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--muted); }
    
    .list-body { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .list-body.minimized { display: none; }

    .region-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: var(--surface); border-radius: 8px; border: 1px solid var(--line);
      cursor: pointer; transition: background 0.1s;
    }
    .region-row:hover { background: var(--line); }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }

    /* Left Sidebar Panel (Nation Info & Flag) */
    .side-panel {
      position: absolute; left: 16px; top: 76px; width: 220px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 10px; z-index: 20;
    }

    .flag-box {
      width: 100%; height: 50px; border: 1px solid var(--ink);
      background: repeating-linear-gradient(45deg, var(--ink), var(--ink) 8px, var(--bg) 8px, var(--bg) 16px);
      border-radius: 6px; display: grid; place-items: center;
    }
    .flag-label { background: var(--bg); padding: 2px 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; border: 1px solid var(--ink); }

    .info-group { display: flex; flex-direction: column; gap: 2px; }
    .info-label { font-size: 10px; text-transform: uppercase; font-weight: 700; color: var(--muted); }
    .info-value { font-size: 13px; font-weight: 600; }

    .manage-btn {
      margin-top: 4px; width: 100%; height: 36px; border-radius: 999px;
      border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
      font-weight: 600; font-size: 12px; cursor: pointer;
    }

    /* Central Modal Panel */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: grid; place-items: center; z-index: 30; padding: 20px;
    }
    .center-modal {
      width: min(100%, 400px); background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 14px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-family: var(--serif); font-size: 20px; margin: 0; }
    .close-btn { background: none; border: 0; font-size: 20px; cursor: pointer; color: var(--ink); }

    .status-row {
      display: flex; align-items: center; gap: 10px; padding: 10px;
      background: var(--surface); border-radius: 8px; border: 1px solid var(--line);
    }
    .status-circle { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card { padding: 10px; background: var(--surface); border-radius: 8px; border: 1px solid var(--line); }
    .stat-card span { display: block; font-size: 10px; text-transform: uppercase; font-weight: 700; color: var(--muted); }
    .stat-card b { font-size: 14px; color: var(--ink); }
  </style>
</head>
<body class="auto-theme">

  <div class="app" style="position:relative;">
    <header class="top">
      <div class="brand">Territorial Map</div>
      <a href="index.html" class="back-btn">‹ Back to Hub</a>
    </header>

    <div class="content-container">
      <!-- 4 Regions Map Container -->
      <div class="map-container" id="mapContainer">
        <!-- Rendered dynamically via script -->
      </div>

      <!-- Collapsible Regional List -->
      <div class="list-card">
        <div class="list-header" onclick="toggleList()">
          <h3 class="list-title">Regional Status List</h3>
          <button class="toggle-list-btn" id="toggleBtn">[-] Minimize</button>
        </div>
        <div class="list-body" id="regionListBody">
          <!-- Rendered dynamically via script -->
        </div>
      </div>
    </div>

    <!-- Left Side Box (Appears on region selection) -->
    <div class="side-panel" id="sidePanel" hidden>
      <div class="flag-box"><span class="flag-label" id="flagLabel">FLAG</span></div>
      <div class="info-group">
        <span class="info-label">Sovereign State</span>
        <span class="info-value" id="sideNationName">-</span>
      </div>
      <div class="info-group">
        <span class="info-label">Region Name</span>
        <span class="info-value" id="sideRegionName">-</span>
      </div>
      <div class="info-group">
        <span class="info-label">Lore / Info</span>
        <span class="info-value" id="sideEnvInfo">-</span>
      </div>
      <button class="manage-btn" id="btnOpenManage" onclick="openCentralManagement()">Manage Territory</button>
    </div>
  </div>

  <!-- Central Management Modal -->
  <div class="modal-overlay" id="manageModal" hidden>
    <div class="center-modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalRegionTitle">Management</h3>
        <button class="close-btn" onclick="closeCentralManagement()">×</button>
      </div>
      <div class="status-row">
        <div class="status-circle" id="modalStatusDot"></div>
        <div>
          <div style="font-size:13px; font-weight:700;" id="modalStatusText">Status</div>
          <div style="font-size:11px; color:var(--muted);" id="modalPovertyText">Condition</div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><span>Production Index</span><b id="modalProdIndex">1.0x</b></div>
        <div class="stat-card"><span>Factories</span><b id="modalFactories">0</b></div>
        <div class="stat-card"><span>Steel Reserve</span><b id="modalSteel">0 Tons</b></div>
        <div class="stat-card"><span>Oil Reserve</span><b id="modalOil">0 Bbl</b></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "sovereign_worlds_v5";
    let saves = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let activeWorld = saves.length > 0 ? saves[0] : null;

    const playerName = (activeWorld && activeWorld.name.trim() !== "") ? activeWorld.name : "Player Empire";
    const playerLore = (activeWorld && activeWorld.desc.trim() !== "") ? activeWorld.desc : "Grand Strategy State";

    const regions = [
      { id: 0, name: "Capital Core", owner: playerName, isPlayer: true, status: 2, poverty: "Prosperous", prodIndex: "1.80x", factories: 4, steel: 450, oil: 200 },
      { id: 1, name: "Northern Iron Hills", owner: playerName, isPlayer: true, status: 7, poverty: "Impoverished", prodIndex: "0.90x", factories: 2, steel: 120, oil: 40 },
      { id: 2, name: "Western Coast", owner: "Neutral Republic", isPlayer: false, status: 4, poverty: "Stable", prodIndex: "1.20x", factories: 1, steel: 80, oil: 310 },
      { id: 3, name: "Southern Wasteland", owner: playerName, isPlayer: true, status: 10, poverty: "Critical Poverty", prodIndex: "0.45x", factories: 0, steel: 10, oil: 5 }
    ];

    let selectedIndex = null;
    let listMinimized = false;

    // 10-tone color scale from Green (1) to Red/Orange (10)
    function getUrgencyColor(val) {
      // 1 = Green (hue 120), 5 = Orange/Yellow (hue 40), 10 = Red (hue 0)
      const hue = ((10 - val) / 9) * 120;
      return `hsl(${hue}, 85%, 45%)`;
    }

    function renderView() {
      const mapContainer = document.getElementById('mapContainer');
      const listBody = document.getElementById('regionListBody');
      mapContainer.innerHTML = '';
      listBody.innerHTML = '';

      regions.forEach((r, i) => {
        const color = getUrgencyColor(r.status);

        // Map box
        const box = document.createElement('div');
        box.className = `map-region-box ${selectedIndex === i ? 'selected' : ''}`;
        box.onclick = () => selectRegion(i);
        box.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:11px; font-weight:700; color:var(--muted);">${r.owner}</span>
            <div class="map-dot" style="background:${color}"></div>
          </div>
          <div class="map-region-title">${r.name}</div>
        `;
        mapContainer.appendChild(box);

        // List row
        const row = document.createElement('div');
        row.className = 'region-row';
        row.onclick = () => selectRegion(i);
        row.innerHTML = `
          <span><b>${r.name}</b> <small style="color:var(--muted);">(${r.owner})</small></span>
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:12px; font-weight:600;">Urgency: ${r.status}/10</span>
            <div class="status-dot" style="background:${color}"></div>
          </div>
        `;
        listBody.appendChild(row);
      });
    }

    function selectRegion(index) {
      selectedIndex = index;
      const r = regions[index];
      renderView();

      document.getElementById('sideNationName').textContent = r.owner;
      document.getElementById('sideRegionName').textContent = r.name;
      document.getElementById('sideEnvInfo').textContent = playerLore.substring(0, 30) + "...";
      document.getElementById('flagLabel').textContent = r.owner.substring(0, 10);

      document.getElementById('btnOpenManage').style.display = r.isPlayer ? 'block' : 'none';
      document.getElementById('sidePanel').hidden = false;
    }

    function toggleList() {
      listMinimized = !listMinimized;
      document.getElementById('regionListBody').classList.toggle('minimized', listMinimized);
      document.getElementById('toggleBtn').textContent = listMinimized ? '[+] Expand' : '[-] Minimize';
    }

    function openCentralManagement() {
      if (selectedIndex === null) return;
      const r = regions[selectedIndex];

      document.getElementById('modalRegionTitle').textContent = `${r.name} - Management`;
      document.getElementById('modalStatusDot').style.background = getUrgencyColor(r.status);
      document.getElementById('modalStatusText').textContent = `Urgency Level: ${r.status}/10`;
      document.getElementById('modalPovertyText').textContent = `Condition: ${r.poverty}`;
      
      document.getElementById('modalProdIndex').textContent = r.prodIndex;
      document.getElementById('modalFactories').textContent = `${r.factories} Active`;
      document.getElementById('modalSteel').textContent = `${r.steel} Tons`;
      document.getElementById('modalOil').textContent = `${r.oil} Bbl`;

      document.getElementById('manageModal').hidden = false;
    }

    function closeCentralManagement() {
      document.getElementById('manageModal').hidden = true;
    }

    renderView();
  </script>
</body>
</html>
